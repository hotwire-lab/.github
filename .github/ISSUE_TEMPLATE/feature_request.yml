name: Feature Request
description: Suggest a new measurement mode, protocol decoder, or improvement
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: dropdown
    id: tool
    attributes:
      label: Target Tool
      options:
        - Logic Analyzer
        - Oscilloscope
        - SDR
        - Serial Terminal
        - Signal Generator (upcoming)
        - Shared Core / UI
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Use case & proposed feature
      description: What problem does this solve, and how would you like it to work?
    validations:
      required: true
