name: Bug Report
description: Report an issue with hardware connection, flashing, or measurements
title: "[Bug]: "
labels: ["bug"]
body:
  - type: dropdown
    id: tool
    attributes:
      label: Tool
      options:
        - Logic Analyzer
        - Oscilloscope
        - SDR
        - Serial Terminal
        - Signal Generator
        - Web Flasher / hotwire-core
    validations:
      required: true
  - type: dropdown
    id: board
    attributes:
      label: Hardware Board
      options:
        - Seeed Studio XIAO ESP32-S3
        - Seeed Studio XIAO ESP32-C6
        - Other ESP32 / USB-UART adapter
        - Offline Demo mode (no hardware)
    validations:
      required: true
  - type: input
    id: firmware
    attributes:
      label: Firmware & Transport
      placeholder: "e.g. v1.2.0 (Web Serial), v2.0.0 (WebUSB), or Demo mode"
    validations:
      required: false
  - type: input
    id: env
    attributes:
      label: Browser & OS
      placeholder: "e.g. Chrome 131 on Windows 11, or Edge on Android 15 (USB-OTG)"
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the issue, steps to reproduce, and any console or flasher log output.
    validations:
      required: true
